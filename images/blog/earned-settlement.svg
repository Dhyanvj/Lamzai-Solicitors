<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="UK Immigration Changes – Passport and the 3, 5, 10 and 20-year pathways to settlement">
  <title>UK Immigration Changes: The New Settlement Rules</title>
  <defs>
    <linearGradient id="es-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1e"/>
      <stop offset="60%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#1a3468"/>
    </linearGradient>
    <linearGradient id="es-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c178"/>
      <stop offset="100%" stop-color="#a8872d"/>
    </linearGradient>
    <linearGradient id="es-col" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243d6b"/>
      <stop offset="100%" stop-color="#132848"/>
    </linearGradient>
    <linearGradient id="es-col-hi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c4a80"/>
      <stop offset="100%" stop-color="#162d54"/>
    </linearGradient>
    <linearGradient id="es-passport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3a6e"/>
      <stop offset="100%" stop-color="#0f2245"/>
    </linearGradient>
    <linearGradient id="es-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f4ed"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <filter id="es-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="es-goldglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="es-brightglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="es-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#c9a84c" opacity="0.2"/>
    </pattern>
    <clipPath id="es-clip"><rect width="800" height="450"/></clipPath>
  </defs>

  <g clip-path="url(#es-clip)">
    <!-- Background -->
    <rect width="800" height="450" fill="url(#es-bg)"/>
    <rect width="800" height="450" fill="url(#es-dots)"/>

    <!-- Ghosted hourglass (time to qualify) -->
    <g transform="translate(470, 40)" opacity="0.06" fill="#c9a84c">
      <rect x="-70" y="0" width="140" height="12" rx="4"/>
      <rect x="-70" y="300" width="140" height="12" rx="4"/>
      <path d="M-55,12 L55,12 L55,40 Q55,110 8,156 Q55,202 55,272 L55,300 L-55,300 L-55,272 Q-55,202 -8,156 Q-55,110 -55,40 Z"/>
    </g>

    <!-- Desk surface -->
    <rect x="60" y="345" width="680" height="16" rx="3" fill="#1a0e05"/>
    <rect x="60" y="340" width="680" height="8" rx="3" fill="#2a1a0a" opacity="0.8"/>

    <!-- === RESIDENCE DOCUMENT (behind passport) === -->
    <g transform="translate(150, 168) rotate(7)" filter="url(#es-shadow)">
      <rect x="0" y="0" width="150" height="168" rx="4" fill="url(#es-card)"/>
      <rect x="0" y="0" width="150" height="6" rx="2" fill="#c9a84c" opacity="0.9"/>
      <rect x="16" y="20" width="96" height="7" rx="2" fill="#0d1f3c" opacity="0.6"/>
      <rect x="16" y="34" width="70" height="5" rx="2" fill="#0d1f3c" opacity="0.4"/>
      <rect x="16" y="47" width="118" height="1.5" rx="0.75" fill="#c9a84c" opacity="0.5"/>
      <rect x="16" y="58" width="118" height="5" rx="2" fill="#0d1f3c" opacity="0.4"/>
      <rect x="16" y="71" width="104" height="5" rx="2" fill="#0d1f3c" opacity="0.35"/>
      <rect x="16" y="84" width="112" height="5" rx="2" fill="#0d1f3c" opacity="0.35"/>
      <rect x="16" y="97" width="86" height="5" rx="2" fill="#0d1f3c" opacity="0.3"/>
      <!-- Approval stamp -->
      <g transform="translate(108, 130) rotate(-14)">
        <circle cx="0" cy="0" r="22" fill="none" stroke="#a8872d" stroke-width="2" opacity="0.75"/>
        <circle cx="0" cy="0" r="17" fill="none" stroke="#a8872d" stroke-width="1" opacity="0.6"/>
        <polyline points="-8,0 -2,6 9,-6" stroke="#a8872d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
      </g>
    </g>

    <!-- === PASSPORT === -->
    <g transform="translate(78, 150) rotate(-6)" filter="url(#es-shadow)">
      <!-- Pages edge -->
      <rect x="6" y="6" width="138" height="192" rx="8" fill="#e8e0d0"/>
      <!-- Cover -->
      <rect x="0" y="0" width="138" height="192" rx="8" fill="url(#es-passport)"/>
      <rect x="0" y="0" width="12" height="192" rx="4" fill="#0a1830" opacity="0.6"/>
      <rect x="8" y="8" width="122" height="176" rx="5" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.35"/>
      <text x="72" y="40" font-family="Georgia, serif" font-size="10" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.85">UNITED KINGDOM</text>
      <!-- Emblem: shield with key -->
      <g transform="translate(72, 98)">
        <circle cx="0" cy="0" r="30" fill="none" stroke="url(#es-gold)" stroke-width="1.5" opacity="0.8"/>
        <path d="M0,-20 L17,-13 L17,2 Q17,16 0,23 Q-17,16 -17,2 L-17,-13 Z" fill="none" stroke="url(#es-gold)" stroke-width="2"/>
        <circle cx="0" cy="-4" r="5" fill="none" stroke="#c9a84c" stroke-width="2"/>
        <line x1="0" y1="1" x2="0" y2="14" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="9" x2="5" y2="9" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="72" y="160" font-family="Georgia, serif" font-size="14" fill="#c9a84c" text-anchor="middle" letter-spacing="4" opacity="0.95">PASSPORT</text>
    </g>

    <!-- === SETTLEMENT PATHWAY COLUMNS (3 / 5 / 10 / 20 years) === -->
    <!-- Column 1: 3 years -->
    <g filter="url(#es-shadow)">
      <rect x="340" y="290" width="76" height="52" rx="3" fill="url(#es-col)"/>
      <rect x="340" y="290" width="76" height="4" rx="2" fill="#c9a84c" opacity="0.85"/>
    </g>
    <text x="378" y="321" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#e2c178" text-anchor="middle">3</text>
    <text x="378" y="335" font-family="Georgia, serif" font-size="8" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.75">YEARS</text>

    <!-- Column 2: 5 years -->
    <g filter="url(#es-shadow)">
      <rect x="432" y="250" width="76" height="92" rx="3" fill="url(#es-col)"/>
      <rect x="432" y="250" width="76" height="4" rx="2" fill="#c9a84c" opacity="0.85"/>
    </g>
    <text x="470" y="284" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#e2c178" text-anchor="middle">5</text>
    <text x="470" y="299" font-family="Georgia, serif" font-size="8" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.75">YEARS</text>

    <!-- Column 3: 10 years (standard pathway, highlighted) -->
    <rect x="510" y="170" width="120" height="190" rx="10" fill="#c9a84c" opacity="0.12" filter="url(#es-brightglow)"/>
    <g filter="url(#es-shadow)">
      <rect x="524" y="196" width="76" height="146" rx="3" fill="url(#es-col-hi)"/>
      <rect x="524" y="196" width="76" height="4" rx="2" fill="#e2c178"/>
      <rect x="524" y="196" width="76" height="146" rx="3" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.55"/>
    </g>
    <text x="562" y="234" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e2c178" text-anchor="middle">10</text>
    <text x="562" y="250" font-family="Georgia, serif" font-size="8" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.8">YEARS</text>
    <rect x="540" y="262" width="44" height="1.5" rx="0.75" fill="#c9a84c" opacity="0.45"/>
    <text x="562" y="278" font-family="Georgia, serif" font-size="7.5" fill="#c9a84c" text-anchor="middle" letter-spacing="1.5" opacity="0.7">STANDARD</text>

    <!-- Column 4: 20 years -->
    <g filter="url(#es-shadow)">
      <rect x="616" y="132" width="76" height="210" rx="3" fill="url(#es-col)"/>
      <rect x="616" y="132" width="76" height="4" rx="2" fill="#c9a84c" opacity="0.85"/>
    </g>
    <text x="654" y="172" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e2c178" text-anchor="middle">20</text>
    <text x="654" y="188" font-family="Georgia, serif" font-size="8" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.75">YEARS</text>

    <!-- Dashed progression line linking column tops -->
    <path d="M378,276 L470,236 L562,182 L654,118" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.55"/>
    <circle cx="378" cy="276" r="4" fill="#c9a84c" opacity="0.9"/>
    <circle cx="470" cy="236" r="4" fill="#c9a84c" opacity="0.9"/>
    <circle cx="562" cy="182" r="4.5" fill="#e2c178"/>
    <circle cx="654" cy="118" r="4" fill="#c9a84c" opacity="0.9"/>

    <!-- === HOME / SETTLEMENT ICON === -->
    <g transform="translate(560, 92)" filter="url(#es-goldglow)">
      <circle cx="0" cy="0" r="34" fill="#c9a84c" opacity="0.08"/>
      <circle cx="0" cy="0" r="28" fill="#0d1f3c" opacity="0.9"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#es-gold)" stroke-width="2"/>
      <path d="M-14,0 L0,-13 L14,0" stroke="#e2c178" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-10,-3 L-10,13 L10,13 L10,-3" stroke="#e2c178" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-3" y="4" width="6" height="9" rx="1" fill="#e2c178"/>
    </g>
    <line x1="560" y1="124" x2="560" y2="160" stroke="#c9a84c" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>

    <!-- === BOTTOM LABEL BAR === -->
    <rect x="0" y="405" width="800" height="45" fill="#000" opacity="0.35"/>
    <rect x="0" y="405" width="800" height="2" fill="#c9a84c" opacity="0.5"/>
    <!-- Category pill -->
    <rect x="30" y="418" width="124" height="22" rx="11" fill="#c9a84c" opacity="0.2"/>
    <rect x="30" y="418" width="124" height="22" rx="11" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <text x="92" y="433" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.9">IMMIGRATION</text>
    <!-- Firm name -->
    <text x="400" y="432" font-family="Georgia, serif" font-size="12" fill="#c9a84c" text-anchor="middle" letter-spacing="3" opacity="0.6">LAMZAI SOLICITORS</text>
    <!-- Date -->
    <text x="762" y="432" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="end" letter-spacing="1" opacity="0.55">NOVEMBER 2026</text>

    <!-- === CORNER BRACKETS === -->
    <path d="M18,18 L18,46 M18,18 L46,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,18 L782,46 M782,18 L754,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M18,395 L18,367 M18,395 L46,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,395 L782,367 M782,395 L754,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Thin border -->
    <rect x="8" y="8" width="784" height="434" fill="none" stroke="#c9a84c" stroke-width="0.75" opacity="0.2"/>
  </g>
</svg>
